name: Deploy uzorai.com Worker to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-deploy-uzorai
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit SHA (REFACTOR #87 AC5) rather than the
      # mutable `v4` tag — a compromised upstream tag move would otherwise
      # execute in this job with write access to Cloudflare deploy secrets.
      # This job never pushes back to the repo, so credential persistence
      # is deliberately disabled (REFACTOR #87 AC3).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: Build and deploy Worker (production)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
