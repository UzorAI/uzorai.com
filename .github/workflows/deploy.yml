name: Deploy UzorAI Worker to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Release environment
        required: true
        type: choice
        options:
          - dev
          - demo
          - production
      confirmation:
        description: Type PROD when target is production
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: worker-deploy-uzorai-${{ github.event_name == 'push' && 'dev' || inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.target }}
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'dev' || inputs.target }}
      PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      # Pinned to an immutable commit SHA (REFACTOR #87 AC5) rather than the
      # mutable `v4` tag — a compromised upstream tag move would otherwise
      # execute in this job with write access to Cloudflare deploy secrets.
      # This job never pushes back to the repo, so credential persistence
      # is deliberately disabled (REFACTOR #87 AC3).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: Validate release target
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            dev|demo) ;;
            production)
              if [ "$PRODUCTION_CONFIRMATION" != "PROD" ]; then
                echo "::error::production deployment requires confirmation PROD"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported deployment target"
              exit 1
              ;;
          esac
      - name: Build and deploy Worker
        run: |
          set -euo pipefail
          npm run build
          npx wrangler deploy --env "$DEPLOY_TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
