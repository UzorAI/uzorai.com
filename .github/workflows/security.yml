name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks/gitleaks-action (the Marketplace wrapper) requires a paid
      # GITLEAKS_LICENSE for organization-owned repos as of its v3 release.
      # The underlying gitleaks scanner itself remains open source, so this
      # downloads and runs that binary directly instead, checksum-verified
      # (the closest equivalent to this repo's SHA-pinned actions, since a
      # raw release binary has no git SHA to pin).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Run gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact -v

  dependency-audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  workflow-lint:
    name: Workflow static analysis (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -version
      # Two known-safe classes of finding are ignored, both pre-dating this
      # workflow and verified as false positives rather than fixed in place:
      # - both self-hosted runner labels (contabo, zilin) are real but
      #   actionlint has no way to know a custom label is valid without a
      #   config file naming every current and future label explicitly;
      #   ignoring the specific message is more robust to label changes.
      # - SC2016/SC2317 fire on embedded non-shell syntax (a GraphQL query
      #   string, jq filters) and on functions invoked only via `trap`,
      #   both patterns shellcheck's static analysis cannot see through.
      - name: Lint workflow files
        run: |
          ./actionlint -ignore 'label "(contabo|zilin)" is unknown' -ignore 'SC2016' -ignore 'SC2317'
