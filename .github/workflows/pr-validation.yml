# .github/workflows/pr-validation.yml — thin caller to htu-foundation's
# canonical PR-validation contract (CHORE htu-foundation#351, adopted here
# under CHORE #62). No validator logic is copied into this repo — see
# https://github.com/zi007lin/htu-foundation/blob/main/.github/workflows/pr-validation.yml
# for the single source of truth.
#
# Pinned to the first stable release tag:
# https://github.com/zi007lin/htu-foundation/releases/tag/pr-validation-contract-v0.1.0
#
# Observe-only (blocking: false) until an explicit later decision, after an
# observe-only bake period with real PR traffic, flips it to blocking.
#
# NOTE: htu-foundation is a private repo owned by zi007lin; its Actions
# cross-repo access is currently granted at the `user` level (repos owned
# by zi007lin). This repo is owned by the UzorAI organization, not
# zi007lin, so that grant does not cover it — the self-triggered check on
# this PR is expected to fail closed (access-denied or startup_failure,
# not yet distinguished) until a broader grant is made. Non-blocking
# either way (blocking: false). See CHORE UzorAI/uzorai.com#62 and the
# sibling zzv-skills#675 / htu.io#330 adoptions for the platform-issue
# trail already documented there.

name: PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    uses: zi007lin/htu-foundation/.github/workflows/pr-validation.yml@pr-validation-contract-v0.1.0
    with:
      test_command: "npm test"
      typecheck_command: "npx tsc --noEmit"
      blocking: false
    secrets: inherit
