# .github/workflows/pr-validation.yml — thin caller to the canonical
# PR-validation contract, hosted at zi007lin/htu-pr-validation
# (extracted from htu-foundation under FEAT htu-foundation#362).
#
# Pinned to the fourth stable release tag, the contract's first release
# from its new public home:
# https://github.com/zi007lin/htu-pr-validation/releases/tag/pr-validation-contract-v0.4.0
#
# v0.2.0 (BUG htu-foundation#353) fixed a cross-repo workflow_call
# resolution defect and requires each caller to declare its own explicit
# permissions: block (below) — unchanged in v0.4.0.
#
# v0.3.0 (BUG htu-foundation#359) fixed a dependency-install defect
# exposed by zzv-skills' own version-bump PR — no caller-side change
# required for that fix beyond the pinned ref bump.
#
# v0.4.0 (FEAT htu-foundation#362) resolves the structural block this
# repo previously carried: htu-foundation stayed private, and GitHub's
# platform rule ("public caller repositories can only access reusable
# workflows from public repositories") meant this repo — public, owned
# by the UzorAI organization — could never invoke it, no matter which
# tag was pinned or how access was configured. The contract now lives at
# zi007lin/htu-pr-validation, a repo that is itself public, so this
# repo's self-triggered check should now actually run for the first time.
#
# Observe-only (blocking: false) until an explicit later decision, after an
# observe-only bake period with real PR traffic, flips it to blocking.
#
# Documented pin exception (REFACTOR #83, D5/AC4): this reusable workflow is
# intentionally pinned to a release tag rather than an immutable commit SHA.
# zi007lin/htu-pr-validation is versioned as a deliberate, human-managed
# "contract" (see the v0.2.0/v0.3.0/v0.4.0 history above, each bumped in its
# own reviewed commit) — pinning to a SHA would replace that reviewed
# version-bump process with an opaque hash and gain no additional integrity
# guarantee the tag-bump discipline doesn't already provide. scripts/security
# /assert-workflow-hardening.mjs allow-lists this exact reference.

name: PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: zi007lin/htu-pr-validation/.github/workflows/pr-validation.yml@pr-validation-contract-v0.4.0
    with:
      test_command: "npm test"
      typecheck_command: "npx tsc --noEmit"
      blocking: false
    secrets: inherit
