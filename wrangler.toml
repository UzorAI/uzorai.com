# UzorAI Worker — REFACTOR #15.
# Named release environments keep development, demo, and production independently
# deployable. Bare `npm run deploy` is deliberately safe and targets dev.
name = "uzorai"
main = "src/server/index.ts"
compatibility_date = "2025-01-01"

[env.dev]
name = "uzorai-dev"
routes = [{ pattern = "dev.uzorai.com", custom_domain = true }]

[env.dev.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.demo]
name = "uzorai-demo"
routes = [
  { pattern = "uzorai.com", custom_domain = true },
  { pattern = "www.uzorai.com", custom_domain = true },
]

[env.demo.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.production]
name = "uzorai-production"
routes = [
  { pattern = "uzor.ai", custom_domain = true },
  { pattern = "www.uzor.ai", custom_domain = true },
]

[env.production.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
